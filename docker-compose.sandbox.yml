# Coding sandbox (#141) — an overlay, never the default.
#
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d --build
#
# The base file deliberately does not grant what a coding job needs. This
# overlay adds exactly six things:
#
#   1. **The Docker socket.** Root-equivalent by definition — a process with it
#      can do anything the daemon can. It is a deliberate owner-only v1
#      decision (recorded on #141); the real capability boundary is #138, and
#      this file is where the cost is visible rather than buried in the base
#      deployment.
#   2. **A host-visible workspace directory.** A sibling container's bind
#      source is resolved on the HOST, not inside the server container, so the
#      same tree is mounted twice: at `/home/jarvis/.jarvis/jobs` for the
#      server, and from its host path for the job (via
#      `JARVIS_SANDBOX_WORKSPACE_HOST_ROOT`). Pointing the job at the server's
#      path would silently mount an empty directory — the trap the sandbox
#      probe (`npm run probe:sandbox`) reproduces.
#   3. **The sandbox switch and its allowlist.** `JARVIS_SANDBOX=docker` is what
#      makes the surface exist at all; `JARVIS_SANDBOX_REPOS` starts empty, so a
#      deployment that has not named a repository cannot clone one.
#   4. **A broker sidecar on an internal network.** Jobs join
#      `jarvis-sandbox`, a network with no route out and no DNS. The only other
#      container on it is `proxy`, which has a second network card on `default`
#      — so the sidecar is the job's one door: the credential broker on 54322
#      and a public-only forward proxy on 54323. The server is deliberately NOT
#      on that network any more; a job must not be able to reach its API.
#   5. **The sidecar's own process.** It runs `dist/sandbox/proxyServer.js` from
#      the server image, reads the HMAC secret from the shared data volume, and
#      asks the server (`/internal/job-state`) whether a job may still spend the
#      provider key.
#   6. **The GitHub App, passed through.** Publishing, follow-ups and the
#      tracker tools need the App's env; without this a deployed container
#      runs jobs but cannot open or update a pull request.
#
# The job image itself is built separately (`docker build -f Dockerfile.job -t
# jarvis-job:latest .`) and is not started by compose: each job is one
# short-lived container the server creates and reaps.
services:
    jarvis:
        environment:
            JARVIS_SANDBOX: "docker"
            JARVIS_SANDBOX_IMAGE: "${JARVIS_SANDBOX_IMAGE:-jarvis-job:latest}"
            # Absolute host path, because the daemon resolves it. `PWD` is
            # exported by a normal shell; set JARVIS_SANDBOX_WORKSPACE_HOST_ROOT
            # explicitly when composing from a context where it is not.
            JARVIS_SANDBOX_WORKSPACE_HOST_ROOT: "${JARVIS_SANDBOX_WORKSPACE_HOST_ROOT:-${PWD}/.jarvis/jobs}"
            JARVIS_SANDBOX_REPOS: "${JARVIS_SANDBOX_REPOS:-}"
            # The ladder (`id` or `id@limit`, comma-separated); the older
            # one-model setting still works as the fallback.
            JARVIS_SANDBOX_MODELS: "${JARVIS_SANDBOX_MODELS:-}"
            JARVIS_SANDBOX_MODEL: "${JARVIS_SANDBOX_MODEL:-big-pickle}"
            JARVIS_SANDBOX_MODEL_CONTEXT: "${JARVIS_SANDBOX_MODEL_CONTEXT:-200000}"
            # The OpenCode workspace key. It stays in the server and the
            # sidecar: each job is handed a token derived from its own id
            # (#141 phase 7).
            JARVIS_SANDBOX_API_KEY: "${JARVIS_SANDBOX_API_KEY:-}"
            # The OpenCode Console API, where Big Pickle is free. Override for
            # the Go endpoint, another provider, or a local model (leave the key
            # empty for a local one).
            JARVIS_SANDBOX_LLM_BASE_URL: "${JARVIS_SANDBOX_LLM_BASE_URL:-https://opencode.ai/inference/openai/v1}"
            # The broker is the sidecar on the job network; the forward proxy
            # is where research and package installs go.
            JARVIS_SANDBOX_PROXY_MODE: "sidecar"
            JARVIS_SANDBOX_PROXY_URL: "${JARVIS_SANDBOX_PROXY_URL:-http://proxy:54322/v1}"
            JARVIS_SANDBOX_EGRESS_PROXY_URL: "${JARVIS_SANDBOX_EGRESS_PROXY_URL:-http://proxy:54323}"
            JARVIS_SANDBOX_NETWORK: "jarvis-sandbox"
            # The job needs no host alias: its only route is the sidecar.
            JARVIS_SANDBOX_EXTRA_HOSTS: "none"
            # Publishing and the tracker tools (#140): the same App, passed
            # through so a deployed container can open and update pull
            # requests. The inline key accepts `\n` escapes; a key *file*
            # needs an extra bind mount, so compose takes the inline form.
            JARVIS_GITHUB_APP_ID: "${JARVIS_GITHUB_APP_ID:-}"
            JARVIS_GITHUB_APP_PRIVATE_KEY: "${JARVIS_GITHUB_APP_PRIVATE_KEY:-}"
            JARVIS_GITHUB_INSTALLATION_ID: "${JARVIS_GITHUB_INSTALLATION_ID:-}"
            JARVIS_GITHUB_API_BASE_URL: "${JARVIS_GITHUB_API_BASE_URL:-}"
            JARVIS_GITHUB_REPOS: "${JARVIS_GITHUB_REPOS:-}"
            JARVIS_GITHUB_REVIEWER: "${JARVIS_GITHUB_REVIEWER:-}"
        # The image runs as uid 10001; the mounted socket is group-owned, so the
        # server needs that group. 0 is what OrbStack/Docker Desktop present
        # inside the container; on a Linux engine set JARVIS_DOCKER_SOCKET_GID
        # to the host socket's GID (`stat -c %g /var/run/docker.sock`).
        group_add:
            - "${JARVIS_DOCKER_SOCKET_GID:-0}"
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./.jarvis/jobs:/home/jarvis/.jarvis/jobs
        networks:
            - default

    # The sidecar: the only container on `jarvis-sandbox` besides the jobs,
    # and the only one with a route to the provider.
    proxy:
        image: jarvis-server:latest
        command: ["node", "dist/sandbox/proxyServer.js"]
        # The server creates the HMAC secret during boot, before it listens;
        # starting the sidecar first makes it exit once with "no proxy secret".
        # Wait for the health check so the first start succeeds.
        depends_on:
            jarvis:
                condition: service_healthy
        restart: unless-stopped
        environment:
            JARVIS_PROXY_UPSTREAM_BASE_URL: "${JARVIS_SANDBOX_LLM_BASE_URL:-https://opencode.ai/inference/openai/v1}"
            # The ladder when set; otherwise the broker falls back to the
            # older one-model setting below.
            JARVIS_PROXY_MODELS: "${JARVIS_SANDBOX_MODELS:-}"
            JARVIS_PROXY_MODEL: "${JARVIS_SANDBOX_MODEL:-big-pickle}"
            JARVIS_PROXY_API_KEY: "${JARVIS_SANDBOX_API_KEY:-}"
            # The secret the server writes beside the database; the same file
            # makes a job's derived token verify on both sides.
            JARVIS_PROXY_SECRET_PATH: "/home/jarvis/.jarvis/sandbox-proxy.key"
            JARVIS_PROXY_STATUS_URL: "http://jarvis:54321"
            # `public` lets the job reach docs and registries but not the host,
            # the LAN, or cloud metadata. Set `allowlist` + HOSTS for stricter.
            JARVIS_PROXY_EGRESS_POLICY: "${JARVIS_SANDBOX_EGRESS_POLICY:-public}"
            JARVIS_PROXY_EGRESS_HOSTS: "${JARVIS_SANDBOX_EGRESS_HOSTS:-}"
        volumes:
            - jarvis-data:/home/jarvis/.jarvis:ro
        networks:
            - default
            - sandbox

networks:
    sandbox:
        name: jarvis-sandbox
        # No route out of this network: the sidecar is the only way to the
        # internet, and the only other container a job can reach.
        internal: true
