<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="referrer" content="no-referrer" />
        <meta
            name="description"
            content="J.A.R.V.I.S. — your personal assistant."
        />
        <meta name="theme-color" content="#000000" />
        <!-- Installable app metadata (#189). The manifest owns the name, icons,
             display mode and start URL; these are the iOS/legacy equivalents
             that Safari still reads from the document. `black` keeps the
             status bar out of the app's content rather than overlapping it. -->
        <meta name="application-name" content="JARVIS" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="JARVIS" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/icons/apple-touch-icon.png"
        />
        <title>JARVIS Web</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
