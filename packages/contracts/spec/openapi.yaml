# OpenAPI 3.1 document for the J.A.R.V.I.S. REST API.
#
# Contract-first: this file is the reviewable source of truth for the REST
# surface (`/api` management routes + `GET /health`), consumed by
# `npm run types` (TS type generation), `npm run lint` (Redocly), and
# `npm run bundle` (single-file artifact for runtime validation).
#
# Phase 2: full spec. Every operation mirrors the handler in
# `packages/server/src/http/authRoutes.ts` (shapes, statuses, and the
# `AUTH_ERROR_STATUS` map — note the API has no 422). New phases consume this
# file; edit it in lockstep with the server when the surface changes.
openapi: 3.1.0
info:
    title: J.A.R.V.I.S. REST API
    description: >-
        Management API mounted at `/api` (plus `GET /health`) for the jarvis-v2
        monorepo. Authentication is a device-token bearer OR a cookie session
        (`jarvis_session`), with explicit `x-csrf-token` on cookie-authenticated
        state changes; cross-cutting logic (CSRF, owner checks) lives in server
        middleware, so this document describes the wire contract, not the auth
        policy. Application errors are returned as
        `{ "error": "<message>" }`; unhandled paths, methods, and server
        failures fall through to Express's default HTML error pages (a JSON
        404/500 handler lands with the runtime-validation phase).
    version: 0.2.0
    license:
        name: MIT
        identifier: MIT
servers:
    - url: /
      description: >-
          Relative to the origin serving this API document. The default local
          development origin is `http://localhost:54321` (`PORT` overrides the
          port); in production the server may be fronted by TLS, in which case
          the `jarvis_session` cookie is renamed `__Host-jarvis_session` (see
          the `session` security scheme).
# No security by default: explicit EMPTY security array so Redocly's
# `security-defined` rule is satisfied for the public operations; every
# protected operation below overrides this at the operation level.
security: []
tags:
    - name: Account
      description: The current user (`GET /api/me`) — identity + owned devices.
    - name: Attachments
      description: Transient image uploads referenced by chat prompts (`POST /api/attachments`).
    - name: Authentication
      description: Credential logins — device-token (`POST /api/auth/login`) and cookie (`POST /api/session`).
    - name: Bootstrap
      description: Single-use first-owner setup.
    - name: ChatSessions
      description: Chat-thread sessions (`/api/sessions`) — the LangGraph threads, not cookie sessions.
    - name: Devices
      description: Device tokens and their lifecycle.
    - name: Health
      description: Machine health checks.
    - name: Jobs
      description: >-
          Scheduled jobs (#90) — timers, reminders and tasks that fire at a
          time of the user's choosing, with their run history.
    - name: Notifications
      description: >-
          JARVIS's outbound messages to a user (#139) — recorded, listed, and
          settled here; pushed live over `/ws` as a `notification` frame.
    - name: Preferences
      description: Free-form per-user integration prefs.
    - name: Session
      description: The cookie login session lifecycle (`GET`/`DELETE /api/session`).
    - name: Stt
      description: >-
          The local speech-recognition model archive served to browser clients
          (`GET /api/stt/model`, issue #84 phase 3b).
    - name: Users
      description: Account management (owner-only read/write).
    - name: Wake
      description: >-
          The local wake-word model files served to browser clients
          (`GET /api/wake/model/{file}`, issue #84 phase 4).
paths:
    /health:
        get:
            operationId: healthCheck
            summary: Machine health check
            description: >-
                Always answers `{ "ok": true }` when the server is up; used by
                monitoring and availability probes and never depends on the
                portal build.
            tags: [Health]
            responses:
                "200":
                    description: Server is up.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [ok]
                                properties:
                                    ok:
                                        type: boolean
                "404":
                    description: >-
                        Non-GET requests answered by Express's default 404. The
                        body is an HTML error page (not modeled); a JSON 404
                        handler lands with the runtime-validation phase.
    /api/attachments:
        post:
            operationId: attachmentUpload
            summary: Upload an image for analysis in a chat prompt
            description: >-
                Accepts a base64-encoded image and returns an id the client
                references in a chat prompt's `attachments` list (see the
                `/ws` AsyncAPI document). The bytes are validated by
                magic-byte sniffing, never by the request's declared type.
                Stored transiently with a fixed TTL — attachment bytes are not
                readable back and are swept on expiry; prompts referencing an
                expired id get an error frame. Requires authentication: guest
                sockets cannot upload, and the per-user storage and
                vision-model budgets are keyed on the caller. Cookie callers
                must send `x-csrf-token`.
            tags: [Attachments]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/XCsrfToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AttachmentUpload"
            responses:
                "201":
                    description: Attachment stored.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AttachmentCreated"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: >-
                        Missing or invalid `x-csrf-token` for a
                        cookie-authenticated request, or the bytes are not a
                        recognized image.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "413":
                    description: >-
                        Decoded bytes exceed the per-attachment cap, or the
                        caller is over their total-attachment budget. The body
                        carries the cap so a client can retry smaller.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AttachmentTooLarge"
                "503":
                    description: >-
                        Upload capacity is saturated — the server-wide
                        in-flight semaphore is full, and uploads are rejected
                        rather than queued. Retry shortly; the body is the
                        plain error envelope.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/bootstrap:
        post:
            operationId: bootstrap
            summary: Bootstrap the first-owner account
            description: >-
                Creates the initial owner account and returns a freshly issued
                device token. Gated by the `JARVIS_BOOTSTRAP_TOKEN` env secret
                (sent as `x-bootstrap-token`), which is consumed on success so a
                leftover secret can never create a second owner. Rate-limited
                per source IP.
            tags: [Bootstrap]
            parameters:
                - $ref: "#/components/parameters/XBootstrapToken"
            requestBody:
                required: true
                description: >-
                    Owner username, password, and optional device name
                    (default `cli`).
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CredentialLogin"
            responses:
                "201":
                    description: Owner account and device token created.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResult"
                "400":
                    description: Malformed or out-of-range request body.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: The `x-bootstrap-token` secret did not match.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: >-
                        An owner already exists, or first-owner setup is
                        disabled (no `JARVIS_BOOTSTRAP_TOKEN` configured).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "429":
                    description: Too many bootstrap attempts; try again later.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "500":
                    description: Unexpected server error.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/auth/login:
        post:
            operationId: authLogin
            summary: Log in with username and password for a device token
            description: >-
                Verifies credentials against the stored hash and provisions a
                fresh device token (shown once). Disabled accounts are
                rejected. Rate-limited per `(IP, username)` and per IP, sharing
                one quota with the cookie login (`POST /api/session`).
            tags: [Authentication]
            requestBody:
                required: true
                description: >-
                    Username, password, and optional device name (default
                    `cli`).
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CredentialLogin"
            responses:
                "200":
                    description: Credentials verified; device token issued.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AuthResult"
                "400":
                    description: Malformed or out-of-range request body.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Invalid username or password.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: The account is disabled.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No owner configured yet; bootstrap first.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "429":
                    description: Too many attempts; try again later.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "500":
                    description: Unexpected server error (e.g. a corrupt stored password hash).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/session:
        post:
            operationId: sessionLogin
            summary: Log in with username and password for a cookie session
            description: >-
                Verifies credentials, then sets a `jarvis_session` cookie
                (`HttpOnly`/`SameSite=Strict`, `__Host-` prefixed under TLS) and
                returns the user plus the CSRF token the portal must echo on
                state-changing requests. Shares the login rate limit with
                `POST /api/auth/login`.
            tags: [Authentication]
            requestBody:
                required: true
                description: Username and password (no device name for cookie login).
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UsernamePassword"
            responses:
                "201":
                    description: Session established; the `Set-Cookie` header carries the session cookie.
                    headers:
                        Set-Cookie:
                            description: >-
                                The `jarvis_session` cookie (renamed
                                `__Host-jarvis_session` under TLS), `HttpOnly`,
                                `SameSite=Strict`.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/SessionLogin"
                "400":
                    description: Malformed or out-of-range request body.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Invalid username or password.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: The account is disabled.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No owner configured yet; bootstrap first.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "429":
                    description: Too many attempts; try again later.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "500":
                    description: Unexpected server error (e.g. a corrupt stored password hash).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        get:
            operationId: sessionGet
            summary: Echo the current session identity
            description: >-
                Returns the authenticated user. `csrfToken` is present only for
                cookie-authenticated callers (bearer callers omit it); the
                portal uses it as its CSRF nonce.
            tags: [Session]
            security:
                - bearerToken: []
                - session: []
            responses:
                "200":
                    description: Current user and (for cookies) the CSRF token.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Session"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        delete:
            operationId: sessionLogout
            summary: End the current cookie session
            description: >-
                Revokes the present session and clears the cookie. Cookie-
                authenticated callers must send `x-csrf-token`; bearer callers
                pass without it.
            tags: [Session]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/XCsrfToken"
            responses:
                "204":
                    description: Session revoked; cookie cleared.
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: Missing or invalid `x-csrf-token` for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/me:
        get:
            operationId: meGet
            summary: Current user and their devices
            description: >-
                The authenticated caller's account plus the devices they have
                provisioned.
            tags: [Account]
            security:
                - bearerToken: []
                - session: []
            responses:
                "200":
                    description: The caller's user row and device list.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/MeResult"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/devices:
        post:
            operationId: deviceProvision
            summary: Provision a new device token
            description: >-
                Issues a fresh device token for the caller. The secret is shown
                exactly once in the response; store it, it cannot be recovered
                afterwards. Cookie-authenticated callers must send
                `x-csrf-token`.
            tags: [Devices]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/XCsrfToken"
            requestBody:
                required: false
                description: Optional device name (default `cli`).
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ProvisionDevice"
            responses:
                "201":
                    description: Device token issued (shown once).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DeviceProvisionResult"
                "400":
                    description: Malformed or out-of-range request body.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: Missing or invalid `x-csrf-token` for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/devices/{id}:
        patch:
            operationId: deviceRename
            summary: Rename a device
            description: >-
                Renames an owned device. The caller may only manage their own
                devices (an owner may manage any). Cookie-authenticated callers
                must send `x-csrf-token`.
            tags: [Devices]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathDeviceId"
                - $ref: "#/components/parameters/XCsrfToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RenameDevice"
            responses:
                "200":
                    description: Device renamed.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/DeviceResult"
                "400":
                    description: Malformed or out-of-range request body.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: >-
                        The device belongs to another user, or the
                        `x-csrf-token` is missing/invalid for a cookie-
                        authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such device.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        delete:
            operationId: deviceRevoke
            summary: Revoke a device
            description: >-
                Revokes a device token so it can no longer authenticate. The
                caller may only manage their own devices (an owner may manage
                any). Cookie-authenticated callers must send `x-csrf-token`.
            tags: [Devices]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathDeviceId"
                - $ref: "#/components/parameters/XCsrfToken"
            responses:
                "204":
                    description: Device revoked.
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: >-
                        The device belongs to another user, or the
                        `x-csrf-token` is missing/invalid for a cookie-
                        authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such device.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/users:
        get:
            operationId: usersList
            summary: List accounts
            description: Owner-only. Returns every account's public row.
            tags: [Users]
            security:
                - bearerToken: []
                - session: []
            responses:
                "200":
                    description: All accounts.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/User"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: The caller is not an owner.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        post:
            operationId: userCreate
            summary: Create an account
            description: >-
                Owner-only. Creates a user with an optional role (default
                `user`). Cookie-authenticated callers must send `x-csrf-token`.
            tags: [Users]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/XCsrfToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateUser"
            responses:
                "201":
                    description: Account created.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserResult"
                "400":
                    description: Malformed or out-of-range request body.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: >-
                        The caller is not an owner, or the `x-csrf-token` is
                        missing/invalid for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: The username is already taken.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/users/{id}:
        patch:
            operationId: userUpdate
            summary: Update an account role or disabled flag
            description: >-
                Owner-only. Provide at least one of `role` / `disabled`. A user
                cannot disable their own account (400); demoting the last
                *enabled* owner is refused with 409 `LAST_OWNER`.
                Cookie-authenticated callers must send `x-csrf-token`.
            tags: [Users]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathUserId"
                - $ref: "#/components/parameters/XCsrfToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateUser"
            responses:
                "200":
                    description: Updated account row.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserResult"
                "400":
                    description: Malformed or out-of-range request body (e.g. self-disable).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: >-
                        The caller is not an owner, or the `x-csrf-token` is
                        missing/invalid for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: Demoting the last enabled owner is refused.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/users/{id}/devices:
        get:
            operationId: userDevicesList
            summary: List another account's devices
            description: Owner-only. For management views of a specific account.
            tags: [Devices]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathUserId"
            responses:
                "200":
                    description: The target account's devices.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Device"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: The caller is not an owner.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/users/{id}/prefs:
        get:
            operationId: userPrefsGet
            summary: Read another account's preferences
            description: Owner-only.
            tags: [Preferences]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathUserId"
            responses:
                "200":
                    description: The target account's prefs map (possibly empty).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Prefs"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: The caller is not an owner.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        put:
            operationId: userPrefsSet
            summary: Upsert another account's preferences
            description: >-
                Owner-only. Replaces the value of each given key; omitted keys
                keep their value. The body must contain at least one key
                (server-enforced). Cookie-authenticated callers must send
                `x-csrf-token`.
            tags: [Preferences]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathUserId"
                - $ref: "#/components/parameters/XCsrfToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Prefs"
            responses:
                "200":
                    description: The updated prefs map.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Prefs"
                "400":
                    description: Malformed prefs body (not an object, empty, too many keys, a key that is too long, or a value rejected for a known key such as `notify.*`).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: >-
                        The caller is not an owner, or the `x-csrf-token` is
                        missing/invalid for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        delete:
            operationId: userPrefsDelete
            summary: Clear another account's preferences
            description: >-
                Owner-only. Removes every pref key for the account (a no-op 204
                when there are none). Cookie-authenticated callers must send
                `x-csrf-token`.
            tags: [Preferences]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathUserId"
                - $ref: "#/components/parameters/XCsrfToken"
            responses:
                "204":
                    description: Prefs cleared.
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: >-
                        The caller is not an owner, or the `x-csrf-token` is
                        missing/invalid for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/prefs:
        get:
            operationId: prefsGet
            summary: Read the caller's preferences
            description: The caller's own free-form integration prefs map.
            tags: [Preferences]
            security:
                - bearerToken: []
                - session: []
            responses:
                "200":
                    description: The caller's prefs map (possibly empty).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Prefs"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        put:
            operationId: prefsSet
            summary: Upsert the caller's preferences
            description: >-
                Replaces the value of each given key; omitted keys keep their
                value. The body must contain at least one key (server-enforced).
                Cookie-authenticated callers must send `x-csrf-token`.
            tags: [Preferences]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/XCsrfToken"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Prefs"
            responses:
                "200":
                    description: The updated prefs map.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Prefs"
                "400":
                    description: Malformed prefs body (not an object, empty, too many keys, a key that is too long, or a value rejected for a known key such as `notify.*`).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: Missing or invalid `x-csrf-token` for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        delete:
            operationId: prefsDelete
            summary: Clear the caller's preferences
            description: >-
                Removes every pref key for the caller (a no-op 204 when there
                are none). Cookie-authenticated callers must send `x-csrf-token`.
            tags: [Preferences]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/XCsrfToken"
            responses:
                "204":
                    description: Prefs cleared.
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: Missing or invalid `x-csrf-token` for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/sessions:
        get:
            operationId: sessionsList
            summary: List chat-thread sessions
            description: >-
                An owner sees every session (including the owning `userId`); a
                non-owner sees only their own. These are the LangGraph chat
                threads, not cookie login sessions.
            tags: [ChatSessions]
            security:
                - bearerToken: []
                - session: []
            responses:
                "200":
                    description: Session summaries.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/SessionSummary"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/sessions/{threadId}:
        delete:
            operationId: chatSessionDelete
            summary: Delete a chat-thread session
            description: >-
                Deletes the caller's own thread (an owner may delete any).
                Cookie-authenticated callers must send `x-csrf-token`.
            tags: [ChatSessions]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathThreadId"
                - $ref: "#/components/parameters/XCsrfToken"
            responses:
                "204":
                    description: Thread deleted.
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "403":
                    description: Missing or invalid `x-csrf-token` for a cookie-authenticated request.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such session, or it belongs to another user.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/stt/model:
        get:
            operationId: sttModelGet
            summary: Download the local speech-recognition model archive
            description: >-
                Serves the client-side WASM speech engine's model archive
                (#84 phase 3b): the browser downloads this tar.gz once,
                extracts it into IndexedDB, and runs recognition fully
                on-device — no audio ever leaves the client. The server
                fetches the archive from its configured upstream
                (`JARVIS_STT_MODEL_URL`) on the first request, caches it
                privately under `~/.jarvis/stt`, and streams the cached file
                after that. Public by design: the archive is open-source
                model weights, never user data, and the recognition worker
                cannot attach auth headers to its fetch. Long-lived cache
                headers apply (the archive changes only with server
                configuration).
            tags: [Stt]
            security: []
            responses:
                "200":
                    description: The model archive (a gzipped tar of the model folder).
                    content:
                        application/gzip:
                            schema:
                                type: string
                                format: binary
                "404":
                    description: >-
                        STT model serving is not configured
                        (`JARVIS_STT_PROVIDER` unset).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "503":
                    description: >-
                        The upstream download failed (transient — the next
                        request retries; the body is the plain error
                        envelope).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/wake/model/{file}:
        get:
            operationId: wakeModelGet
            summary: Download a local wake-word model file
            description: >-
                Serves one ONNX file for the client-side openWakeWord
                detector (#84 phase 4): the browser loads the two feature
                models (`melspectrogram.onnx`, `embedding_model.onnx`) plus
                the `hey_jarvis` classifier (`hey_jarvis_v0.1.onnx`) and
                runs wake-word detection fully on-device. The server fetches
                each file from its configured upstream
                (`JARVIS_WAKE_MODEL_URL`) on the first request, caches it
                privately under `~/.jarvis/wake`, and streams the cached
                file after that. Same-origin serving is required: the
                upstream release assets send no CORS headers, so a browser
                fetch from the page would be blocked. Public by design: the
                weights are open-source model files, never user data, and
                the detector's worker cannot attach auth headers to its
                fetch. Long-lived cache headers apply (the files change only
                with server configuration). Only the three known files are
                served — anything else answers 404.
            tags: [Wake]
            security: []
            parameters:
                - $ref: "#/components/parameters/PathWakeFile"
            responses:
                "200":
                    description: The ONNX model file.
                    content:
                        application/octet-stream:
                            schema:
                                type: string
                                format: binary
                "404":
                    description: >-
                        Unknown file, or wake model serving is not configured
                        (`JARVIS_WAKE_PROVIDER` unset).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "503":
                    description: >-
                        The upstream download failed (transient — the next
                        request retries; the body is the plain error
                        envelope).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        head:
            operationId: wakeModelHead
            summary: Probe wake-word model serving availability
            description: >-
                The web client's wake-toggle capability probe (#84 phase 4):
                answers 200 from configuration alone when wake model serving
                is configured, without triggering a multi-megabyte download
                just to decide whether to show the switch. An unknown file
                or an unconfigured server answers 404.
            tags: [Wake]
            security: []
            parameters:
                - $ref: "#/components/parameters/PathWakeFile"
            responses:
                "200":
                    description: >-
                        Wake model serving is configured for this file (no
                        body is sent).
                "404":
                    description: >-
                        Unknown file, or wake model serving is not configured
                        (`JARVIS_WAKE_PROVIDER` unset).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/notifications:
        get:
            operationId: notificationsList
            summary: List the caller's notifications
            description: >-
                Newest first. Dismissed notifications are excluded unless
                `includeDismissed=true`; a `snoozed` one is still listed, since
                the user should be able to find what they deferred. `unread`
                counts everything not settled — neither read, answered,
                dismissed nor snoozed — for a badge.
            tags: [Notifications]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - name: limit
                  in: query
                  required: false
                  description: >-
                      Page size (1–200, default 50). Out-of-range or
                      unparsable values fall back to the default rather than
                      failing the request.
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 200
                - name: includeDismissed
                  in: query
                  required: false
                  description: Include notifications the user dismissed.
                  schema:
                      type: boolean
            responses:
                "200":
                    description: The caller's notifications and unread count.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/NotificationList"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        post:
            operationId: notificationsCreate
            summary: Raise a notification for the caller
            description: >-
                The producer entry point (a tool, the scheduler, or a manual
                call): records the notification and attempts to push it to the
                caller's live `/ws` sockets. `delivered` is how many clients
                received the frame, and `suppressed` says why nothing was
                pushed — `null` when it was delivered, otherwise `disabled`
                (the caller's `notify.enabled` pref), `quiet-hours`,
                `absent` (no live socket), or `cap` (the per-user delivery
                budget). A suppressed notification is still recorded and
                appears in the list. Cookie-authenticated callers must send
                `x-csrf-token`.
            tags: [Notifications]
            security:
                - bearerToken: []
                - session: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/NotificationInput"
            responses:
                "201":
                    description: The recorded notification and its delivery outcome.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/NotificationDelivery"
                "400":
                    description: >-
                        Missing or over-long field, or an unknown priority
                        (server-enforced bounds match the wire protocol's).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/notifications/{id}/read:
        post:
            operationId: notificationsRead
            summary: Mark a notification read
            description: >-
                Idempotent: reading an already-settled notification returns it
                unchanged. A notification belonging to another account is
                indistinguishable from one that does not exist (404).
            tags: [Notifications]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathNotificationId"
            responses:
                "200":
                    description: The settled notification.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/NotificationSettlement"
                "400":
                    description: >-
                        A malformed notification id (over-long). Normally the
                        shape validator answers this before the route runs.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such notification for this account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/notifications/{id}/dismiss:
        post:
            operationId: notificationsDismiss
            summary: Dismiss a notification
            description: >-
                Removes it from the default list without marking it read.
                Idempotent, with the same 404 scope as `read`.
            tags: [Notifications]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathNotificationId"
            responses:
                "200":
                    description: The settled notification.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/NotificationSettlement"
                "400":
                    description: >-
                        A malformed notification id (over-long). Normally the
                        shape validator answers this before the route runs.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such notification for this account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/notifications/{id}/answer:
        post:
            operationId: notificationsAnswer
            summary: Answer a notification that asked a question
            description: >-
                For a notification raised with `requiresAnswer`. The reply is
                what retires it — answering is the notification's `answered`
                state, and a producer reads the answer back from the record.
                Cookie-authenticated callers must send `x-csrf-token`.
            tags: [Notifications]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - $ref: "#/components/parameters/PathNotificationId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: false
                            required:
                                - answer
                            properties:
                                answer:
                                    type: string
                                    minLength: 1
                                    maxLength: 2000
            responses:
                "200":
                    description: The answered notification.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/NotificationSettlement"
                "400":
                    description: >-
                        The notification does not require an answer, or the
                        answer is missing or over-long.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such notification for this account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: The notification is already settled.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/jobs:
        get:
            operationId: jobsList
            summary: List the caller's scheduled jobs
            description: >-
                Newest-created first. Settled jobs (`done`, `failed`,
                `cancelled`, `missed`) are history and are excluded unless
                `includeSettled=true`, so the default answer is the work still
                owed.
            tags: [Jobs]
            security:
                - bearerToken: []
                - session: []
            parameters:
                - name: limit
                  in: query
                  required: false
                  description: >-
                      Page size (1–200, default 50). Out-of-range or
                      unparsable values fall back to the default rather than
                      failing the request.
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 200
                - name: includeSettled
                  in: query
                  required: false
                  description: Include jobs that have already settled.
                  schema:
                      type: boolean
            responses:
                "200":
                    description: The caller's jobs.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobList"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        post:
            operationId: jobsCreate
            summary: Schedule a job for the caller
            description: >-
                Creates a `message` job — text with nothing to run, which is
                what a timer or a reminder actually needs. `class` is the
                caller's to name here, because a page is the user's own hand,
                and it decides how loudly the announcement arrives: a `timer`
                pierces quiet hours, a `reminder` and a `notification` wait for
                the window to end. (The model cannot name a class — its own
                tools each own one — because that would be a way to pierce
                quiet hours by asking.) `runAt` is an instant, the output of a
                picker; the model speaks times as words through its tools
                instead. A moment in the past, a `timer` more than a day ahead,
                a moment beyond `JARVIS_JOB_MAX_HORIZON_DAYS`, and a full queue
                are each refused. `quiet` on the response is what will happen
                to the announcement as the prefs stand today — a prediction,
                because the prefs are read again when it fires.
                Cookie-authenticated callers must send `x-csrf-token`.
            tags: [Jobs]
            security:
                - bearerToken: []
                - session: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/JobCreateRequest"
            responses:
                "201":
                    description: The stored job and its quiet-hours forecast.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobSaved"
                "400":
                    description: >-
                        Missing or malformed field, a `class` that is not a
                        class, a label or message over the protocol's bound, a
                        moment already passed, or a timer set more than a day
                        ahead.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: >-
                        The per-user pending cap
                        (`JARVIS_JOB_MAX_PER_USER`) is reached; cancel one
                        first.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/jobs/{id}:
        parameters:
            - $ref: "#/components/parameters/PathJobId"
        get:
            operationId: jobsGet
            summary: One job and its run history
            description: >-
                The job plus every attempt at it, newest first — what a detail
                view reads. A job that belongs to another account is answered
                404, the same as one that does not exist.
            tags: [Jobs]
            security:
                - bearerToken: []
                - session: []
            responses:
                "200":
                    description: The job and its runs.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobDetail"
                "400":
                    description: A malformed job id (over-long).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such job for this account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        patch:
            operationId: jobsUpdate
            summary: Edit a pending job
            description: >-
                Only `label`, `message` and `runAt` — and only while the job is
                `pending`. Its `class` and `kind` are what the job *is*:
                changing either means cancelling and scheduling another, which
                is also what keeps a reminder from being edited into a timer
                (a class change is how loudly the user gets interrupted). An
                empty patch, a `message` on a job that has none (a tool or
                prompt job), a refused moment, and a job that has already
                started are each answered rather than ignored.
                Cookie-authenticated callers must send `x-csrf-token`.
            tags: [Jobs]
            security:
                - bearerToken: []
                - session: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/JobUpdateRequest"
            responses:
                "200":
                    description: The job as it now stands, and its forecast.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobSaved"
                "400":
                    description: >-
                        An empty patch, an uneditable field (`class`, `kind`),
                        a malformed or over-long value, or a moment already
                        passed.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such job for this account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: >-
                        The job is no longer `pending` — it is running or has
                        settled — so it cannot be edited.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
        delete:
            operationId: jobsDelete
            summary: Cancel a pending job
            description: >-
                Only a job that has not started can be cancelled: one already
                running is being worked on, and its result is on its way. The
                cancelled job comes back as it now stands (`state:
                cancelled`). Cookie-authenticated callers must send
                `x-csrf-token`.
            tags: [Jobs]
            security:
                - bearerToken: []
                - session: []
            responses:
                "200":
                    description: The cancelled job.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobCancelled"
                "400":
                    description: A malformed job id (over-long).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such job for this account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: >-
                        The job is running or has settled — there is nothing
                        to cancel.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
    /api/jobs/{id}/snooze:
        parameters:
            - $ref: "#/components/parameters/PathJobId"
        post:
            operationId: jobsSnooze
            summary: Snooze a reminder
            description: >-
                A reminder that has not fired is *moved* (its moment changes,
                no attempt is counted, nothing is announced); one that already
                had its moment is *set again* for the new time with the same
                payload, which is a new job — `action` says which happened, and
                `previousRunAt` carries the moment the settled one was owed.
                Only a reminder can be snoozed: a timer is a countdown and a
                notification is already filed. Snoozing also settles the
                notification that announced the reminder (`snoozed`), because
                the deferral *is* the acknowledgement — one request, and the row
                stops asking for attention (#90 phase 6c). A refused snooze
                settles nothing. Cookie-authenticated callers must send
                `x-csrf-token`.
            tags: [Jobs]
            security:
                - bearerToken: []
                - session: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/JobSnoozeRequest"
            responses:
                "200":
                    description: The snoozed (or re-created) reminder.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/JobSnoozed"
                "400":
                    description: >-
                        `minutes` missing or outside its range, or the job is
                        not a reminder.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "401":
                    description: Missing or invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "404":
                    description: No such job for this account.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
                "409":
                    description: >-
                        The reminder was cancelled, is running, lost a race to
                        a claim, or holds a payload a snooze could not repeat
                        (a prompt job).
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Error"
components:
    securitySchemes:
        bearerToken:
            type: http
            scheme: bearer
            description: >-
                An opaque device token issued by `POST /api/bootstrap`, `POST
                /api/auth/login`, or `POST /api/devices`. It is shown exactly
                once at issue time and cannot be recovered.
        session:
            type: apiKey
            in: cookie
            name: jarvis_session
            description: >-
                The login session cookie set by `POST /api/session`
                (`HttpOnly`/`SameSite=Strict`). Under TLS it is renamed
                `__Host-jarvis_session` and flagged `Secure`; the plain
                `jarvis_session` name is used over cleartext HTTP. Cookie-
                authenticated state-changing requests must also send
                `x-csrf-token`.
    parameters:
        PathUserId:
            name: id
            in: path
            required: true
            description: The target account's integer row id.
            schema:
                type: integer
        PathDeviceId:
            name: id
            in: path
            required: true
            description: The target device's integer row id.
            schema:
                type: integer
        PathThreadId:
            name: threadId
            in: path
            required: true
            description: The chat-thread session id (at most 128 characters).
            schema:
                type: string
                minLength: 1
                maxLength: 128
        PathWakeFile:
            name: file
            in: path
            required: true
            description: >-
                The wake-model file to serve. Only three files exist —
                `melspectrogram.onnx`, `embedding_model.onnx`, and
                `hey_jarvis_v0.1.onnx` — and anything outside that allowlist
                answers 404 (the server, not the shape layer, owns that
                decision, so an unknown name stays a 404 rather than a 400).
                The schema forbids path separators so the parameter can never
                leave the cache directory.
            schema:
                type: string
                minLength: 1
                pattern: '^[^/\s]+$'
        PathNotificationId:
            name: id
            in: path
            required: true
            description: >-
                The notification's opaque id, as returned by the list route.
                Ids belong to one account: an id owned by somebody else is
                answered 404, the same as one that does not exist.
            schema:
                type: string
                minLength: 1
                maxLength: 64
        PathJobId:
            name: id
            in: path
            required: true
            description: >-
                The job's opaque id, as returned by the list route. Ids belong
                to one account: an id owned by somebody else is answered 404,
                the same as one that does not exist.
            schema:
                type: string
                minLength: 1
                maxLength: 64
        XBootstrapToken:
            name: x-bootstrap-token
            in: header
            required: false
            description: >-
                The `JARVIS_BOOTSTRAP_TOKEN` secret that gates first-owner
                setup. Optional at the shape layer on purpose: a missing or
                mismatched secret is an authorization outcome (403, or 409
                when setup is disabled), decided by the server — not a
                request-shape violation.
            schema:
                type: string
        XCsrfToken:
            name: x-csrf-token
            in: header
            required: false
            description: >-
                Required on cookie-authenticated state-changing requests —
                echo the `csrfToken` from the session response. Bearer-token
                callers omit it.
            schema:
                type: string
    schemas:
        AttachmentUpload:
            type: object
            description: >-
                A base64-encoded image upload. Only `data` is meaningful —
                the type is decided by magic-byte sniffing of the decoded
                bytes, never by a declared mime.
            required: [data]
            properties:
                data:
                    type: string
                    description: >-
                        Base64-encoded image bytes (PNG, JPEG, GIF, or WebP).
                        `maxLength` corresponds to the server's decoded-byte
                        cap (4 MiB → 5,592,408 base64 characters); oversize
                        bodies are answered `413` by the route, not by shape
                        validation. Deliberately no `pattern`: a regex over
                        megabytes of base64 is real CPU on every request, and
                        a broken encoding surfaces as a decode failure (403),
                        not a shape violation.
                    maxLength: 5592408
        AttachmentCreated:
            type: object
            description: The id to reference in a chat prompt's `attachments` list.
            required: [attachmentId]
            properties:
                attachmentId:
                    type: string
                    description: >-
                        Opaque attachment id (a 24-character base64url string
                        in the current implementation). The protocol accepts
                        ids up to 32 characters, leaving slack for a future
                        scheme.
                    minLength: 1
                    maxLength: 32
        AttachmentTooLarge:
            type: object
            description: Rejection for a too-large upload or an exhausted budget.
            required: [error, code, maxBytes]
            properties:
                error:
                    type: string
                code:
                    type: string
                    enum:
                        - ATTACHMENT_TOO_LARGE
                    description: Machine-readable reason a client branches on.
                maxBytes:
                    type: integer
                    description: The per-attachment cap in decoded bytes.
        Error:
            type: object
            description: User-safe error envelope returned by the JSON error handler.
            required: [error]
            properties:
                error:
                    type: string
        User:
            type: object
            description: Public account row as exposed by the `/api` routes.
            required: [id, username, role, disabled, createdAt]
            properties:
                id:
                    type: integer
                    readOnly: true
                    description: Stable integer row id.
                username:
                    type: string
                    minLength: 1
                    maxLength: 64
                role:
                    enum: [owner, user]
                disabled:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                    readOnly: true
        Device:
            type: object
            description: Public device credential row as exposed by the `/api` routes.
            required: [id, name, prefix, createdAt, lastSeenAt]
            properties:
                id:
                    type: integer
                    readOnly: true
                name:
                    type: string
                    minLength: 1
                    maxLength: 64
                prefix:
                    type: string
                    readOnly: true
                    description: Short opaque identifier prefix, never the token itself.
                createdAt:
                    type: string
                    format: date-time
                    readOnly: true
                lastSeenAt:
                    readOnly: true
                    description: Last authenticated use, or null if never seen.
                    type: [string, "null"]
                    format: date-time
        IssuedDevice:
            type: object
            description: >-
                A freshly provisioned device credential: the persisted row plus
                the one-time secret token that is never stored.
            required: [id, name, prefix, token]
            properties:
                id:
                    type: integer
                    readOnly: true
                name:
                    type: string
                    minLength: 1
                    maxLength: 64
                prefix:
                    type: string
                    readOnly: true
                token:
                    type: string
                    readOnly: true
                    description: The one-time bearer secret; shown once and unrecoverable.
        AuthResult:
            type: object
            description: Response of both device-token flows (`/api/bootstrap` and `/api/auth/login`).
            required: [user, device]
            properties:
                user:
                    $ref: "#/components/schemas/User"
                device:
                    $ref: "#/components/schemas/IssuedDevice"
        Session:
            type: object
            description: >-
                Session identity echo (`GET /api/session`). `csrfToken` is
                omitted for bearer-authenticated callers, so it is optional.
            required: [user]
            properties:
                user:
                    $ref: "#/components/schemas/User"
                csrfToken:
                    type: string
                    readOnly: true
                    description: The CSRF nonce (cookie sessions only).
        SessionLogin:
            type: object
            description: Response of `POST /api/session` (cookie login).
            required: [user, csrfToken, expiresAt]
            properties:
                user:
                    $ref: "#/components/schemas/User"
                csrfToken:
                    type: string
                    readOnly: true
                expiresAt:
                    type: string
                    format: date-time
                    readOnly: true
                    description: When the session expires (the cookie's `Max-Age` target).
        MeResult:
            type: object
            description: Response of `GET /api/me`.
            required: [user, devices]
            properties:
                user:
                    $ref: "#/components/schemas/User"
                devices:
                    type: array
                    items:
                        $ref: "#/components/schemas/Device"
        UserResult:
            type: object
            description: Singular user response (`POST /api/users`, `PATCH /api/users/{id}`).
            required: [user]
            properties:
                user:
                    $ref: "#/components/schemas/User"
        DeviceResult:
            type: object
            description: Singular device response (`PATCH /api/devices/{id}`).
            required: [device]
            properties:
                device:
                    $ref: "#/components/schemas/Device"
        DeviceProvisionResult:
            type: object
            description: Response of `POST /api/devices`.
            required: [device]
            properties:
                device:
                    $ref: "#/components/schemas/IssuedDevice"
        SessionSummary:
            type: object
            description: >-
                A chat-thread session row. `userId` is null for guest threads
                (which are deleted on socket close) or may differ from the
                caller for owner listings.
            required: [threadId, kind, userId, createdAt, lastActiveAt]
            properties:
                threadId:
                    type: string
                    minLength: 1
                    maxLength: 128
                    description: Matches the protocol's `sessionId` bound.
                kind:
                    enum: [text, voice]
                userId:
                    type: [integer, "null"]
                createdAt:
                    type: string
                    format: date-time
                lastActiveAt:
                    type: string
                    format: date-time
        Prefs:
            type: object
            description: >-
                Free-form per-user integration preferences: a map of string keys
                (1–256 chars, at most 64 entries) to any JSON value. PUT bodies
                must contain at least one key (server-enforced); a store may be
                empty when read. Keys the server itself reads — today
                `notify.enabled` (boolean or null) and `notify.quietHours`
                (`{ start, end }` `"HH:MM"` times, or null for off) — are
                validated on write, so a malformed value is a 400 rather than a
                setting that saves and then does nothing. Other keys are
                free-form.
            maxProperties: 64
            propertyNames:
                type: string
                minLength: 1
                maxLength: 256
            additionalProperties: true
        UsernamePassword:
            type: object
            description: Credentials for cookie login (`POST /api/session`).
            required: [username, password]
            properties:
                username:
                    type: string
                    minLength: 1
                    maxLength: 64
                password:
                    type: string
                    minLength: 8
                    maxLength: 1024
        CredentialLogin:
            type: object
            description: >-
                Credentials for device-token flows (`POST /api/bootstrap` and
                `POST /api/auth/login`). `deviceName` defaults to `cli`.
            required: [username, password]
            properties:
                username:
                    type: string
                    minLength: 1
                    maxLength: 64
                password:
                    type: string
                    minLength: 8
                    maxLength: 1024
                deviceName:
                    type: string
                    minLength: 1
                    maxLength: 64
                    default: cli
        ProvisionDevice:
            type: object
            description: Body of `POST /api/devices`. `deviceName` defaults to `cli`.
            properties:
                deviceName:
                    type: string
                    minLength: 1
                    maxLength: 64
                    default: cli
        CreateUser:
            type: object
            description: Body of `POST /api/users`. `role` defaults to `user`.
            required: [username, password]
            properties:
                username:
                    type: string
                    minLength: 1
                    maxLength: 64
                password:
                    type: string
                    minLength: 8
                    maxLength: 1024
                role:
                    enum: [owner, user]
                    default: user
        UpdateUser:
            type: object
            description: >-
                Body of `PATCH /api/users/{id}`. At least one of `role` /
                `disabled` must be present.
            minProperties: 1
            properties:
                role:
                    enum: [owner, user]
                disabled:
                    type: boolean
        RenameDevice:
            type: object
            description: Body of `PATCH /api/devices/{id}`.
            required: [name]
            properties:
                name:
                    type: string
                    minLength: 1
                    maxLength: 64
        NotificationInput:
            type: object
            description: >-
                Body of `POST /api/notifications`. Field bounds mirror the wire
                protocol's (`@lukestanbery/jarvis-protocol`), so anything
                accepted here can be rendered by any client.
            required: [kind, title]
            properties:
                kind:
                    type: string
                    description: >-
                        Producer-defined category ("job.finished",
                        "reminder", …). Free-form so a new producer needs no
                        server change.
                    minLength: 1
                    maxLength: 64
                title:
                    type: string
                    minLength: 1
                    maxLength: 200
                body:
                    type: string
                    maxLength: 2000
                class:
                    type: string
                    description: >-
                        What kind of attention this asks for (#90). A `timer`
                        pierces the caller's quiet hours; a `reminder` and a
                        `notification` wait for the window to end. Defaults to
                        `notification` — the quiet class — so a producer with
                        no opinion cannot make an interruption loud by
                        omission. Set by the thing the user asked for (a
                        scheduled reminder, a timer), never by the model.
                    enum: [notification, reminder, timer]
                priority:
                    type: string
                    description: >-
                        Display emphasis and ordering only; it does not decide
                        quiet hours (`class` does — #90). Defaults to
                        `normal`.
                    enum: [low, normal, high, urgent]
                requiresAnswer:
                    type: boolean
                    description: >-
                        Whether the user's reply (not an acknowledgement)
                        retires this — the shape a clarifying question from a
                        background agent uses.
                dedupeKey:
                    type: string
                    description: >-
                        Producer-side coalescing key: while an unsettled
                        notification with the same key exists, a new one
                        replaces it instead of stacking.
                    minLength: 1
                    maxLength: 64
        Notification:
            type: object
            description: One stored notification, as the API exposes it.
            required: [id, kind, class, priority, title, state, createdAt]
            properties:
                id:
                    type: string
                    minLength: 1
                    maxLength: 64
                kind:
                    type: string
                    minLength: 1
                    maxLength: 64
                class:
                    type: string
                    description: >-
                        What kind of attention this asked for (#90). `timer`
                        pierces quiet hours and rings until acknowledged;
                        `reminder` waits and is snoozable; `notification` is
                        informational.
                    enum: [notification, reminder, timer]
                priority:
                    enum: [low, normal, high, urgent]
                title:
                    type: string
                    minLength: 1
                    maxLength: 200
                body:
                    type: string
                    maxLength: 2000
                state:
                    type: string
                    description: >-
                        `pending` — recorded, never pushed (nobody was
                        connected, the delivery budget was spent, or quiet
                        hours suppressed it), so a client finds it through
                        this list instead. `delivered` — pushed to at least one
                        live socket. `read` / `answered` / `dismissed` /
                        `snoozed` are terminal: `answered` is the retirement
                        path for a notification raised with `requiresAnswer`,
                        and `snoozed` is what a reminder the user deferred
                        becomes — the deferral settles the announcement it
                        answered, so a late acknowledgement cannot resurrect it
                        (#90 phase 6c). A `snoozed` row stays in the list,
                        unlike a dismissed one.
                    enum:
                        [pending, delivered, read, answered, dismissed, snoozed]
                requiresAnswer:
                    type: boolean
                answer:
                    type: string
                    description: The user's reply, on an answered notification.
                    maxLength: 2000
                jobId:
                    type: string
                    description: >-
                        The job this notification is about (#90), when a
                        scheduler announcement produced it. It is what lets a
                        reminder's row — or the floating toast, wherever the user
                        is — act on the reminder (snooze it) rather than only
                        acknowledge the notification. Absent for a notification no
                        job stands behind, and nulled if the job is later pruned.
                    maxLength: 64
                createdAt:
                    type: string
                    format: date-time
                deliveredAt:
                    type: string
                    format: date-time
                settledAt:
                    type: string
                    format: date-time
        NotificationList:
            type: object
            description: Body of `GET /api/notifications`.
            required: [notifications, unread]
            properties:
                notifications:
                    type: array
                    items:
                        $ref: "#/components/schemas/Notification"
                unread:
                    type: integer
                    minimum: 0
                    description: >-
                        Notifications not settled — neither read, answered,
                        dismissed nor snoozed (a badge count, so it counts past
                        the page size).
        NotificationSettlement:
            type: object
            description: >-
                Body of the `read` / `dismiss` / `answer` routes: the
                notification as it now stands.
            required: [notification]
            properties:
                notification:
                    $ref: "#/components/schemas/Notification"
        NotificationDelivery:
            type: object
            description: Body of `POST /api/notifications`.
            required: [notification, delivered, suppressed]
            properties:
                notification:
                    $ref: "#/components/schemas/Notification"
                delivered:
                    type: integer
                    minimum: 0
                    description: How many live clients received the frame.
                suppressed:
                    description: >-
                        `null` when it was delivered, otherwise the reason
                        nothing was pushed: `disabled`, `quiet-hours`,
                        `absent` (no live socket), or `cap`.
                    anyOf:
                        - type: string
                          enum: [disabled, quiet-hours, absent, cap]
                        - type: "null"
        JobCreateRequest:
            type: object
            description: >-
                Body of `POST /api/jobs`. A page-created job is always a
                `message` job: text with nothing to run, which is all a timer
                or a reminder needs. Scheduling a *tool* or a *prompt* stays
                with the model's tools, where the allowlist and the target
                tool's own schema are checked before the row is written.
            required: [label, class, runAt]
            properties:
                label:
                    type: string
                    description: >-
                        The headline the user sees ("Kettle", "Call Mum"), at
                        most the protocol's notification-title bound because it
                        becomes the announcement's title.
                    minLength: 1
                    maxLength: 200
                class:
                    type: string
                    description: >-
                        How loudly the announcement arrives. `timer` pierces
                        quiet hours and rings until it is stopped; `reminder`
                        waits out the window and can be snoozed; `notification`
                        is filed and read at leisure.
                    enum: [notification, reminder, timer]
                message:
                    type: string
                    description: >-
                        The detail delivered under the headline. Omitted means
                        the label itself is the message.
                    maxLength: 2000
                runAt:
                    type: string
                    format: date-time
                    description: >-
                        The instant the job is owed at, in ISO-8601 (the
                        picker's output). Must be in the future, within
                        `JARVIS_JOB_MAX_HORIZON_DAYS`, and — for a `timer` —
                        no more than a day ahead.
        JobUpdateRequest:
            type: object
            description: >-
                Body of `PATCH /api/jobs/{id}`. At least one field is required;
                `class` and `kind` are absent on purpose, because changing
                either is a different job rather than an edit.
            minProperties: 1
            properties:
                label:
                    type: string
                    minLength: 1
                    maxLength: 200
                message:
                    type: string
                    description: >-
                        Only for a job that is itself a message job — a tool or
                        prompt job has no text to edit and answers 400.
                    minLength: 1
                    maxLength: 2000
                runAt:
                    type: string
                    format: date-time
                    description: >-
                        A new moment for a job that has not started. Refused in
                        the past, beyond the horizon, and beyond a day for a
                        `timer`.
        JobSnoozeRequest:
            type: object
            description: Body of `POST /api/jobs/{id}/snooze`.
            required: [minutes]
            properties:
                minutes:
                    type: number
                    description: >-
                        How long from now to snooze, in minutes. The short end
                        is half a minute: a snooze is a human-scale "not now".
                    minimum: 0.5
                    maximum: 1440
        QuietForecast:
            type: object
            description: >-
                What the caller's quiet hours, as they stand, will do to this
                job's announcement. A prediction, not a promise: the window is
                read again when the job fires, so a change in between changes
                the outcome.
            required: [state]
            properties:
                state:
                    type: string
                    description: >-
                        `clear` — nothing will hold it. `disabled` — the
                        account's `notify.enabled` is off, so the announcement
                        will be recorded but not pushed. `held` — the moment
                        falls inside quiet hours for a class that respects them,
                        and the announcement waits until `until` (for a
                        `reminder`, the job itself does).
                    enum: [clear, disabled, held]
                until:
                    type: string
                    format: date-time
                    description: When a `held` announcement comes back.
                window:
                    type: string
                    description: >-
                        The quiet window as the user set it (`22:00–07:00`),
                        present when `held`.
        Job:
            type: object
            description: One scheduled job, as the API exposes it.
            required:
                [id, label, class, kind, state, runAt, attempts, createdAt]
            properties:
                id:
                    type: string
                    minLength: 1
                    maxLength: 64
                label:
                    type: string
                    minLength: 1
                    maxLength: 200
                class:
                    type: string
                    description: >-
                        The delivery class the job's announcement carries (#90)
                        — `timer` pierces quiet hours, `reminder` and
                        `notification` wait.
                    enum: [notification, reminder, timer]
                kind:
                    type: string
                    description: >-
                        What the job does when it fires: `message` delivers text
                        (a timer or reminder, no model and no tool), `tool`
                        invokes one allowlisted tool, `prompt` runs a turn.
                    enum: [prompt, tool, message]
                state:
                    type: string
                    description: >-
                        `pending` — owed. `running` — claimed by the scheduler
                        right now. `done` / `failed` — it ran, with the result
                        in its runs. `cancelled` — the user called it off.
                        `missed` — its moment passed while the server was down,
                        so it was never attempted.
                    enum: [pending, running, done, failed, cancelled, missed]
                runAt:
                    type: string
                    format: date-time
                attempts:
                    type: integer
                    minimum: 0
                createdAt:
                    type: string
                    format: date-time
                settledAt:
                    type: string
                    format: date-time
                lastError:
                    type: string
                    description: Why a failed run failed.
                    maxLength: 2000
                message:
                    type: string
                    description: The text a `message` job delivers.
                    maxLength: 2000
                toolName:
                    type: string
                    description: The tool a `tool` job runs.
                    maxLength: 64
                prompt:
                    type: string
                    description: The prompt a `prompt` job runs.
                    maxLength: 2000
        JobRun:
            type: object
            description: One attempt at a job — the history a detail view reads.
            required: [id, state, startedAt]
            properties:
                id:
                    type: string
                    minLength: 1
                    maxLength: 64
                state:
                    type: string
                    enum: [running, ok, failed]
                startedAt:
                    type: string
                    format: date-time
                finishedAt:
                    type: string
                    format: date-time
                output:
                    type: string
                    description: >-
                        What the attempt produced — a prompt job's reply, a tool
                        job's result text.
                    maxLength: 2000
                error:
                    type: string
                    description: Why it failed, when it did.
                    maxLength: 2000
        JobList:
            type: object
            description: Body of `GET /api/jobs`.
            required: [jobs]
            properties:
                jobs:
                    type: array
                    items:
                        $ref: "#/components/schemas/Job"
        JobDetail:
            type: object
            description: Body of `GET /api/jobs/{id}`.
            required: [job, runs]
            properties:
                job:
                    $ref: "#/components/schemas/Job"
                runs:
                    type: array
                    description: Every attempt at this job, newest first.
                    items:
                        $ref: "#/components/schemas/JobRun"
        JobSaved:
            type: object
            description: >-
                Body of `POST /api/jobs` and `PATCH /api/jobs/{id}`: the job as
                it now stands, plus what quiet hours will do to it.
            required: [job, quiet]
            properties:
                job:
                    $ref: "#/components/schemas/Job"
                quiet:
                    $ref: "#/components/schemas/QuietForecast"
        JobCancelled:
            type: object
            description: Body of `DELETE /api/jobs/{id}`.
            required: [job]
            properties:
                job:
                    $ref: "#/components/schemas/Job"
        JobSnoozed:
            type: object
            description: Body of `POST /api/jobs/{id}/snooze`.
            required: [action, job, quiet]
            properties:
                action:
                    type: string
                    description: >-
                        `moved` — the reminder had not fired, so its own moment
                        changed. `recreated` — it already had its moment, so a
                        new reminder carries the same payload.
                    enum: [moved, recreated]
                job:
                    $ref: "#/components/schemas/Job"
                quiet:
                    $ref: "#/components/schemas/QuietForecast"
                previousRunAt:
                    type: string
                    format: date-time
                    description: >-
                        When a `recreated` reminder was previously owed; absent
                        for `moved`.
