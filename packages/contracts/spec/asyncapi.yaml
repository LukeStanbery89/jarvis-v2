# AsyncAPI 3.1 document for the J.A.R.V.I.S. chat endpoint.
#
# Contract-first: this file describes the JSON frames exchanged over the /ws
# WebSocket, mirroring the types in `@lukestanbery/jarvis-protocol` (the TS
# source of truth). `npm run validate` checks it; the Phase 6 conformance
# tests prove real frames still match it.
#
# Phase 5: full spec. One message per frame (`clientHello`, `authHandshake`,
# `chatPrompt`, `chunk`, `toolCall`, `toolResult`, `done`, `error`,
# `authResult`) so docs and conformance tests can address each frame
# individually. Payloads are strict (`additionalProperties: false`) and encode
# the protocol's value bounds (`\S` non-empty-after-trim, 128-char
# `sessionId`/`token` caps, the `hello` capability enum/caps). Edit it in
# lockstep with `packages/protocol` — the conformance tests fail otherwise.
asyncapi: 3.1.0
info:
    title: J.A.R.V.I.S. Chat API
    description: >-
        WebSocket chat endpoint at /ws. Clients send one JSON frame per
        WebSocket text message: an optional first-frame `auth` handshake
        binding the socket to a device token, an optional first-frame `hello`
        announcement declaring which response formats the client can render,
        then chat prompts. The server streams the agent's progress back as
        `tool` / `toolResult` notices, `chunk` tokens, and a terminal `done`
        (or `error` + `done`). Frame shapes mirror
        @lukestanbery/jarvis-protocol and must be updated in lockstep with it
        (enforced by the conformance tests).
    version: 0.3.0
defaultContentType: application/json
servers:
    chat:
        host: localhost:54321
        protocol: ws
        pathname: /ws
        description: >-
            Cleartext by default; deployments with `JARVIS_TLS_CERT` /
            `JARVIS_TLS_KEY` serve the same path over `wss`. There is no HTTP
            upgrade-time authentication — identity travels in-band as the
            optional first frame.
channels:
    ws:
        address: /ws
        description: >-
            The single chat channel. Exactly one JSON frame per text message;
            anything that is not a JSON object or matches no known frame
            shape is answered with an `error` frame followed by a terminal
            `done`, and the turn is not started.
        messages:
            clientHello:
                $ref: "#/components/messages/clientHello"
            authHandshake:
                $ref: "#/components/messages/authHandshake"
            chatPrompt:
                $ref: "#/components/messages/chatPrompt"
            authResult:
                $ref: "#/components/messages/authResult"
            chunk:
                $ref: "#/components/messages/chunk"
            toolCall:
                $ref: "#/components/messages/toolCall"
            toolResult:
                $ref: "#/components/messages/toolResult"
            done:
                $ref: "#/components/messages/done"
            error:
                $ref: "#/components/messages/error"
operations:
    sendClientFrame:
        action: send
        channel:
            $ref: "#/channels/ws"
        title: Send a client frame
        summary: Auth handshake, capability announcement, or chat prompt
        description: >-
            The client's first frame may be the `auth` handshake, the `hello`
            capability announcement, or a prompt. `hello` must open the socket
            (the `auth` handshake may come first or immediately after it), each
            arrives at most once and before any prompt. Skipping auth makes
            the socket a guest for its lifetime; a later auth is rejected.
            Every other frame is a chat prompt naming the LangGraph thread
            (`sessionId`, ≤128 chars) to continue. One turn at a time: a
            prompt while a previous turn is streaming — on this socket or any
            other sharing the thread — is answered with an `error` frame.
        messages:
            - $ref: "#/channels/ws/messages/clientHello"
            - $ref: "#/channels/ws/messages/authHandshake"
            - $ref: "#/channels/ws/messages/chatPrompt"
    receiveServerFrame:
        action: receive
        channel:
            $ref: "#/channels/ws"
        title: Receive server frames
        summary: Streamed agent events, terminal `done`, or errors
        description: >-
            Reply to a successful handshake: exactly one `authResult` frame
            (a bad token answers `error` + terminal `done` instead, and the
            socket continues as a guest). Per prompt turn, `toolCall` /
            `toolResult` notices and `chunk` tokens interleave while the
            agent works (chunks concatenate in arrival order into the reply
            text), and a terminal `done` ends the turn. Failures and
            pre-turn rejections (busy thread, foreign session, bad first
            frame, bad token) each answer `error` followed by a terminal
            `done`: the turn either never starts or does not continue.
        messages:
            - $ref: "#/channels/ws/messages/authResult"
            - $ref: "#/channels/ws/messages/chunk"
            - $ref: "#/channels/ws/messages/toolCall"
            - $ref: "#/channels/ws/messages/toolResult"
            - $ref: "#/channels/ws/messages/done"
            - $ref: "#/channels/ws/messages/error"
components:
    messages:
        clientHello:
            title: Client capability announcement
            summary: The client's optional first frame, declaring what it can render
            description: >-
                Telling the server which response formats this client can render.
                Only valid as the socket's first frame — at most once, before
                any prompt (an `auth` handshake may follow it); the server
                stores the declared capabilities for the socket's lifetime and
                conditions the agent's output on them. `capabilities` lists
                tokens from the `markdown` / `html` / `image` / `link` enum —
                at most 16 entries, each a non-empty string ≤16 characters. An
                empty list declares a plain-text-only client.
            payload:
                type: object
                additionalProperties: false
                required:
                    - type
                    - capabilities
                properties:
                    type:
                        const: hello
                    capabilities:
                        type: array
                        maxItems: 16
                        uniqueItems: true
                        items:
                            type: string
                            pattern: \S
                            maxLength: 16
                            enum:
                                - markdown
                                - html
                                - image
                                - link
            examples:
                - payload:
                      type: hello
                      capabilities:
                          - markdown
                          - image
                          - link
        authHandshake:
            title: Auth handshake
            summary: The client's optional handshake, presenting a device token
            description: >-
                Binding the socket to an account. May open the socket (first
                frame) or come immediately after a `hello` frame — never after
                any other frame. The server answers with one `authResult` on
                success or an `error` + terminal `done` (and a guest socket) on
                a bad token. `token` is 1–128 characters, non-empty after
                trimming.
            payload:
                type: object
                additionalProperties: false
                required:
                    - type
                    - token
                properties:
                    type:
                        const: auth
                    token:
                        type: string
                        pattern: \S
                        maxLength: 128
            examples:
                - payload:
                      type: auth
                      token: dvt_a1b2c3d4e5f6
        chatPrompt:
            title: Chat prompt
            summary: Free-text prompt continuing a conversation thread
            description: >-
                `prompt` is non-empty after trimming (no upper bound);
                `sessionId` names the LangGraph thread and is 1–128
                characters after trimming. The optional `mode` selects the
                chat style — `"text"` (the default when omitted) is answered
                using the client's declared rendering capabilities, while
                `"voice"` always yields plain conversational text. The server
                records the mode as the session's `kind` when it first claims
                the thread (write-once: later prompts do not re-claim it).
                Sending this without authenticating first makes the socket a
                guest whose claimed sessions are deleted when it disconnects.
            payload:
                type: object
                additionalProperties: false
                required:
                    - prompt
                    - sessionId
                properties:
                    prompt:
                        type: string
                        pattern: \S
                    sessionId:
                        type: string
                        pattern: \S
                        maxLength: 128
                    mode:
                        type: string
                        enum:
                            - text
                            - voice
                        description: >-
                            The chat mode this prompt runs under; `"text"`
                            when omitted. Voice prompts yield plain
                            conversational text regardless of the client's
                            declared rendering capabilities.
            examples:
                - payload:
                      prompt: What's on my calendar today?
                      sessionId: s-2026-09-25-morning
                - payload:
                      prompt: What's on my calendar today?
                      sessionId: s-2026-09-25-morning
                      mode: voice
        chunk:
            title: Response chunk
            summary: One streamed token of the assistant's reply
            description: >-
                Sent zero or more times per turn before the terminal `done`.
                Chunks concatenate, in arrival order, into the full response
                text.
            payload:
                type: object
                additionalProperties: false
                required:
                    - chunk
                properties:
                    chunk:
                        type: string
            examples:
                - payload:
                      chunk: Sure —
        toolCall:
            title: Tool call notice
            summary: The agent is invoking a tool
            description: >-
                Emitted when the agent starts a tool call. `args` is the
                tool's raw JSON input; it may be absent when the tool takes no
                input.
            payload:
                type: object
                additionalProperties: false
                required:
                    - tool
                properties:
                    tool:
                        type: object
                        additionalProperties: false
                        required:
                            - name
                        properties:
                            name:
                                type: string
                            args: {}
            examples:
                - payload:
                      tool:
                          name: calculator
                          args:
                              expr: 2+2
        toolResult:
            title: Tool result notice
            summary: The agent received a tool's output
            description: >-
                Emitted after a tool call finishes. `output` is the tool's
                raw JSON result; it may be absent.
            payload:
                type: object
                additionalProperties: false
                required:
                    - toolResult
                properties:
                    toolResult:
                        type: object
                        additionalProperties: false
                        required:
                            - name
                        properties:
                            name:
                                type: string
                            output: {}
            examples:
                - payload:
                      toolResult:
                          name: calculator
                          output: "4"
        done:
            title: Turn complete
            summary: Terminal frame of a successful turn
            description: >-
                Always the last frame of a streamed turn. Failures stream
                `error` first and still end with `done`.
            payload:
                type: object
                additionalProperties: false
                required:
                    - done
                properties:
                    done:
                        const: true
            examples:
                - payload:
                      done: true
        error:
            title: Error
            summary: User-facing failure message
            description: >-
                Answers malformed frames, auth failures, busy threads,
                foreign session ids, and model/stream failures. Always
                followed by a terminal `done` frame: the turn either never
                starts or does not continue.
            payload:
                type: object
                additionalProperties: false
                required:
                    - error
                properties:
                    error:
                        type: string
            examples:
                - payload:
                      error: another request is already in progress
        authResult:
            title: Auth result
            summary: Acknowledgment of a successful handshake
            description: >-
                The only reply to a successful `auth` handshake (a frame that
                may open the socket or immediately follow `hello`): `user` is
                the bound account's username and `device` the authenticating
                device's name. Revoked devices are re-checked on every
                subsequent prompt.
            payload:
                type: object
                additionalProperties: false
                required:
                    - authResult
                properties:
                    authResult:
                        type: object
                        additionalProperties: false
                        required:
                            - user
                            - device
                        properties:
                            user:
                                type: string
                            device:
                                type: string
            examples:
                - payload:
                      authResult:
                          user: luke
                          device: cli
